# Blueprint do Render — backend ClearCut no plano GRATUITO (512 MB RAM, <0,5 CPU).
# Usa o motor "lite" (ONNX Runtime puro + modelo u2netp). Medido: ~100 MB em repouso,
# ~370 MB no pior caso (JPEG de 88 MB / 95 MP, 10 imagens mistas seguidas).
services:
  - type: web
    name: clearcut-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements-render.txt && cd backend && python -m app.ai.lite_engine
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # --- Motor leve (obrigatório para caber em 512 MB) ---
      - key: ENGINE
        value: lite
      - key: REMBG_MODEL
        value: u2netp
      - key: LITE_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX        # evita que a RAM "inche" entre pedidos
        value: "2"
      # --- Limites seguros para 512 MB ---
      - key: MAX_CONCURRENT_JOBS     # 1 imagem de cada vez no modelo (os uploads continuam em paralelo)
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: MAX_PIXELS              # JPEG: até 100 MP (é reduzido logo na descodificação)
        value: "100000000"
      - key: MAX_DECODE_PIXELS       # PNG: até 30 MP
        value: "30000000"
      - key: MAX_WEBP_PIXELS         # WebP: até 16 MP (descodificar WebP gasta muita RAM)
        value: "16000000"
      - key: MAX_OUTPUT_PIXELS       # PNG final até 16 MP (fotos maiores são reduzidas, não recusadas)
        value: "16000000"
      - key: MAX_BATCH_FILES
        value: "5"
      - key: FILE_TTL_SECONDS
        value: "300"
      # --- Endereço do frontend na Vercel (preencha no painel do Render) ---
      - key: CORS_ORIGINS
        sync: false
